# Release builds of the dev CLI: `git tag vX.Y.Z && git push --tags` runs
# .github/workflows/release.yml. install.sh downloads dev_<os>_<arch>.tar.gz and
# checks it against checksums.txt. Windows arrives with milestone 5.
version: 2
project_name: dev

builds:
  - id: dev
    dir: cli
    binary: dev
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - name_template: "dev_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files: [none*] # the binary only

checksum:
  name_template: checksums.txt

release:
  prerelease: auto

changelog:
  use: git
  filters:
    exclude: ["^docs:", "^chore:", "^test:"]
