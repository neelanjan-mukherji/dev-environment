# ==========================================
# Lazygit Configuration
# ==========================================

gui:
  nerdFontsVersion: "3"
  showIcons: true
  showFileTree: true
  showRandomTip: false
  showCommandLog: false
  showBottomLine: true
  showPanelJumps: true
  scrollHeight: 2
  sidePanelWidth: 0.3333
  expandFocusedSidePanel: true
  border: rounded
  theme:
    activeBorderColor:
      - green
      - bold
    inactiveBorderColor:
      - white
    optionsTextColor:
      - blue
    selectedLineBgColor:
      - reverse
git:
  autoFetch: true
  autoRefresh: true
  pagers:
    - colorArg: always
os:
  edit: "nvim"
  editAtLine: "nvim --block"
  open: "xdg-open"
  openDirInEditor: "nvim"
update:
  method: never
  days: 14
