name: ci

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older run (no queue of stale jobs).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: shellcheck + render tests
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Install zsh, shellcheck and chezmoi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh shellcheck
          sh -c "$(curl -fsSL https://get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make check

  containers:
    name: install ${{ matrix.base }} / ${{ matrix.profile }} / ${{ matrix.arch }}
    timeout-minutes: 60
    needs: check
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        base: ["ubuntu:24.04", "debian:13", "fedora:43", "archlinux:latest", "alpine:3.22"]
        profile: [minimal, full]
        arch: [amd64, arm64]
        exclude:
          - base: "archlinux:latest" # no official arm64 image
            arch: arm64
          - base: "alpine:3.22" # minimal only (docs/v2-design.md)
            profile: full
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Install and verify in a clean container
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILES: ${{ matrix.profile }}
        run: ci/run-containers.sh "${{ matrix.base }}"

  no-sudo:
    name: install without sudo (ubuntu:24.04 / minimal)
    timeout-minutes: 60
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Install and verify on a machine with no sudo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILES: minimal
          NOSUDO: "1"
        run: ci/run-containers.sh ubuntu:24.04

  windows:
    name: install Windows host
    timeout-minutes: 60
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build dev
        shell: pwsh
        run: cd cli; $env:CGO_ENABLED = '0'; go build -trimpath -o dist/dev.exe .
      # Windows Server runner images have no working winget (Windows 10/11 have
      # it via App Installer): install the official release bundle and its x64
      # dependencies. Windows PowerShell, whose Appx cmdlets are the reliable ones.
      - name: Install winget
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $apps = Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps'
          $env:Path = "$apps;$env:Path"
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            $tmp = Join-Path $env:RUNNER_TEMP 'winget'
            New-Item -ItemType Directory -Force -Path $tmp | Out-Null
            gh release download --repo microsoft/winget-cli --dir $tmp `
              --pattern 'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle' `
              --pattern 'DesktopAppInstaller_Dependencies.zip' --pattern '*_License1.xml'
            if ($LASTEXITCODE -ne 0) { throw 'downloading the winget release failed' }
            Expand-Archive -Path "$tmp\DesktopAppInstaller_Dependencies.zip" -DestinationPath "$tmp\deps"
            $deps = @(Get-ChildItem "$tmp\deps" -Recurse -Filter *.appx | Where-Object { $_.FullName -match '\\x64\\' } | ForEach-Object FullName)
            $bundle = "$tmp\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle"
            $license = (Get-ChildItem "$tmp\*_License1.xml").FullName
            Add-AppxProvisionedPackage -Online -PackagePath $bundle -DependencyPackagePath $deps -LicensePath $license | Out-Null
            Add-AppxPackage -Path $bundle -DependencyPath $deps -ForceUpdateFromAnyVersion
          }
          Add-Content -Path $env:GITHUB_PATH -Value $apps
          winget --version
          if ($LASTEXITCODE -ne 0) { throw 'winget does not run' }
      - name: Install
        shell: pwsh
        env:
          DEVENV_DEV_BIN: ${{ github.workspace }}\cli\dist\dev.exe
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./install.ps1 --yes --name 'CI User' --email ci@example.com
      - name: Verify
        shell: pwsh
        run: ./ci/verify.ps1
