name: ci

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: shellcheck + render tests
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Install zsh, shellcheck and chezmoi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh shellcheck
          sh -c "$(curl -fsSL https://get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make check

  containers:
    name: install ${{ matrix.base }} / ${{ matrix.profile }} / ${{ matrix.arch }}
    timeout-minutes: 60
    needs: check
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        base: ["ubuntu:24.04", "debian:13", "fedora:43", "archlinux:latest", "alpine:3.22"]
        profile: [minimal, full]
        arch: [amd64, arm64]
        exclude:
          - base: "archlinux:latest" # no official arm64 image
            arch: arm64
          - base: "alpine:3.22" # minimal only (docs/v2-design.md)
            profile: full
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Install and verify in a clean container
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILES: ${{ matrix.profile }}
        run: ci/run-containers.sh "${{ matrix.base }}"

  no-sudo:
    name: install without sudo (ubuntu:24.04 / minimal)
    timeout-minutes: 60
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Install and verify on a machine with no sudo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILES: minimal
          NOSUDO: "1"
        run: ci/run-containers.sh ubuntu:24.04

  macos:
    name: install macOS ${{ matrix.runner }} / ${{ matrix.profile }}
    timeout-minutes: 60
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel] # Apple silicon, Intel
        profile: [minimal, full]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build dev
        run: cd cli && CGO_ENABLED=0 go build -trimpath -o dist/dev .
      - name: Install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVENV_DEV_BIN: ${{ github.workspace }}/cli/dist/dev
        run: ./install.sh --yes --profile ${{ matrix.profile }} --name 'CI User' --email ci@example.com
      - name: Verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci/verify.sh

  windows:
    name: install Windows host
    timeout-minutes: 60
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build dev
        shell: pwsh
        run: cd cli; $env:CGO_ENABLED = '0'; go build -trimpath -o dist/dev.exe .
      # Windows Server runner images have no winget (Windows 10/11 have it via App Installer).
      - name: Install winget
        shell: pwsh
        run: |
          # PSResourceGet ships with PowerShell 7.4+ (no NuGet provider step needed).
          Install-PSResource -Name Microsoft.WinGet.Client -Repository PSGallery -TrustRepository -Quiet
          Import-Module Microsoft.WinGet.Client
          Repair-WinGetPackageManager -AllUsers -Latest
          # winget is an app alias in WindowsApps, which a Server PATH may lack.
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            $apps = Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps'
            $env:Path = "$apps;$env:Path"
            Add-Content -Path $env:GITHUB_PATH -Value $apps
          }
          winget --version
      - name: Install
        shell: pwsh
        env:
          DEVENV_DEV_BIN: ${{ github.workspace }}\cli\dist\dev.exe
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./install.ps1 --yes --name 'CI User' --email ci@example.com
      - name: Verify
        shell: pwsh
        run: ./ci/verify.ps1
