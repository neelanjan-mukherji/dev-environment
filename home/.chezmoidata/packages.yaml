# Base system packages, installed with the OS package manager (needs sudo).
# Everything else comes from mise (home/private_dot_config/mise/config.toml.tmpl).
# Linux: the list for the package manager found at install time (apt, dnf, pacman,
# apk). macOS: Homebrew. Windows: winget (the host tools; Linux work happens in WSL).
# Each list should mean the same set: shell, git, curl, compilers, archivers.
packages:
  apt:
    - bash-completion
    - build-essential   # compilers for Treesitter parsers and native extensions
    - ca-certificates
    - curl
    - file
    - git
    - gnupg
    - less
    - locales
    - tree
    - unzip
    - xz-utils
    - zip
    - zsh
  # Fedora (and other dnf distros)
  dnf:
    - bash-completion
    - ca-certificates
    - curl
    - file
    - findutils
    - gcc
    - gcc-c++
    - git
    - glibc-langpack-en
    - gnupg2
    - less
    - libatomic         # Node's official builds link it; not in a minimal Fedora
    - make
    - procps-ng
    - tar
    - tree
    - unzip
    - util-linux-user   # chsh, for the login shell step
    - xz
    - zip
    - zsh
  # Arch (and other pacman distros)
  pacman:
    - base-devel
    - bash-completion
    - ca-certificates
    - curl
    - file
    - git
    - gnupg
    - less
    - tree
    - unzip
    - xz
    - zip
    - zsh
  # Alpine: the minimal profile only (see docs/v2-design.md).
  apk:
    - bash              # the install scripts and the fallback shell
    - bash-completion
    - build-base
    - ca-certificates
    - curl
    - eza               # no arm64 musl build for mise
    - file
    - git
    - gnupg
    - jless             # mise's jless and neovim are glibc builds
    - less
    - ncurses           # terminfo for tmux and nvim
    - neovim            # 0.11 on Alpine 3.22
    - ripgrep           # no arm64 musl build for mise
    - shadow            # chsh, for the login shell step
    - tree
    - unzip
    - xz
    - zip
    - zsh
  # macOS: Homebrew formulae. The Command Line Tools (compilers, git) come with Homebrew.
  brew:
    - bash              # a current bash for the install scripts and the fallback shell
    - git
    - gnupg
    - tmux              # mise's tmux would build from source on macOS
    - tree
    - xz
  # macOS: Homebrew casks (apps and fonts).
  brew_casks:
    - font-jetbrains-mono-nerd-font
    - wezterm
  # Windows host: id, and optionally an exact version and a winget pin (upgrades
  # stay within it). Neovim matches the Linux/macOS pin (mise config).
  winget:
    - id: Git.Git
    - id: GitHub.cli
    - id: twpayne.chezmoi
    - id: Neovim.Neovim
      version: "0.11.7"
      pin: "0.11.*"
    - id: zig.zig              # C compiler for nvim-treesitter parsers
    - id: BurntSushi.ripgrep.MSVC
    - id: sharkdp.fd
    - id: junegunn.fzf
    - id: JesseDuffield.lazygit
    - id: Starship.Starship
    - id: ajeetdsouza.zoxide
    - id: Microsoft.PowerShell
    - id: Microsoft.WindowsTerminal
    - id: DEVCOM.JetBrainsMonoNerdFont
