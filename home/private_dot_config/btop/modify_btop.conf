{{- /* chezmoi:modify-template */ -}}
{{- /* btop rewrites its own config on exit, so only the theme line is managed. */ -}}
{{- $line := printf "color_theme = \"catppuccin_%s\"" .theme.flavor -}}
{{- if regexMatch "(?m)^color_theme = " .chezmoi.stdin -}}
{{ .chezmoi.stdin | replaceAllRegex "(?m)^color_theme = .*$" $line }}
{{- else -}}
{{ $line }}
{{ .chezmoi.stdin }}
{{- end -}}
